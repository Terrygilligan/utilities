name: Bug Report
description: File an anonymous bug report for online-utilities.com
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Found a Bug?

        This utility suite is built and maintained entirely by a 76-year-old independent developer living on a homestead. There is no corporate support desk, and I don't have the time or energy to answer individual support emails.

        However, if you spot a bug or broken feature, let me know anyway! I regularly update and patch the app, so your bug reports go straight into the fix queue for the next update.

        *No account details or personal data are needed — just tell me what broke and paste the anonymous diagnostics blob from the app (footer → Report a Bug → Copy diagnostics).*
  - type: textarea
    id: what-went-wrong
    attributes:
      label: What went wrong?
      description: What you did, what you expected to happen, and what actually happened. Which tool were you using?
      placeholder: "e.g. In the Expense Tracker, after scanning a receipt the amount field stayed empty even though the total was visible on the photo."
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: App Diagnostics
      description: Paste the JSON payload copied from the app (footer → Report a Bug → Copy diagnostics). It's anonymous — browser, URL, and storage usage only.
      placeholder: '{"app": "utility-hub", "timestamp": "...", "url": "...", "userAgent": "...", ...}'
      render: json
    validations:
      required: true
